[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tau-mixing-dqn"
version = "0.1.0"
description = "DQN experiments and tau-mixing estimation utilities"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "experiments*"]